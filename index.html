/* Layout: one narrow column styled like a game-box insert. Beige table, chunky outlined cards, bright pawn colors as highlights. */
:root{
  --bg:#F6F0E2; --surface:#FDFAF2; --raise:#FFFFFF; --ink:#2D2A32; --muted:#5F584D;
  --edge:#3B3540; --line:#E3D9C2; --shadow:#3B3540; --on-bright:#2D2A32; --good:#1F7A4D;
  --c-yellow:#FFD84D; --c-coral:#FF8A78; --c-blue:#7CC6F5; --c-green:#7ED9A6; --c-purple:#C4A8F7; --c-orange:#FFB05C; --c-pink:#F7A8CF;
  --warn-bg:#FFE1DA; --warn-ink:#A7311F;
  color-scheme:light;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'DM Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);padding-inline:16px;padding-block:20px 64px;-webkit-text-size-adjust:100%}
html,body{touch-action:pan-x pan-y;overscroll-behavior-x:none}
input,select,textarea{font-size:16px!important}
.wrap{max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.logo{flex:none;display:block;overflow:visible;width:clamp(72px,22vw,100px);height:auto;aspect-ratio:1}
.meeple{flex:none;display:block;overflow:visible}
h1{font:800 clamp(2.2rem,10vw,3.4rem)/0.92 var(--f-display);letter-spacing:-0.03em;margin:0;text-wrap:balance}
h1 .hl{background:linear-gradient(transparent 60%,var(--c-yellow) 60%);padding-inline:2px}
.tagline{margin-top:6px;font-weight:700;color:var(--muted)}
h2{font:700 1.25rem/1.15 var(--f-display);letter-spacing:-0.01em;margin:0;text-wrap:balance}
h2.chip{display:inline-block;padding:3px 14px;border:2px solid var(--edge);border-radius:999px;box-shadow:0 2px 0 var(--shadow);color:var(--on-bright);font-size:1.1rem}
.c-blue{background:var(--c-blue)}.c-yellow{background:var(--c-yellow)}.c-green{background:var(--c-green)}.c-coral{background:var(--c-coral)}.c-purple{background:var(--c-purple)}
h3{font:700 1rem/1.2 var(--f-display);margin:0}
p{margin:0}
.sub{margin-top:10px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.9rem;max-width:62ch}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--c-blue);outline-offset:2px}

/* board track */
.road{display:flex;gap:4px;align-items:center;margin-top:16px;padding-top:4px}
.road i,.road .seg2{flex:1;min-width:6px;height:18px;border-radius:6px;background:var(--surface);border:2px solid var(--line);padding:0;position:relative;cursor:pointer;display:block;font:inherit;color:inherit;box-sizing:border-box}
.road .seg2::before{content:"";position:absolute;inset:-10px -2px}

  let w=0;const seenG={};for(const rd of S.rounds){const g=gameOf(S,rd.gameId),x=g?g.weight:1;w+=seenG[rd.gameId]?x*0.4:x;seenG[rd.gameId]=1;}
  /* Gauntlet Rank: weighted rounds, scaled gently by table size (6 players = 1.0, never below 0.6 or above 1.3), plus 3 for a final, 3.8 points per star, 5 stars at most. */
  const f=Math.min(1.3,Math.max(0.6,Math.sqrt(S.players.length/6)));
  return Math.min(5,Math.floor((w*f+(hasFinal?3:0))/3.8));
}
function phaseOf(S){
  if(!S.started) return 'setup';
  if(S.rounds.some(r=>!roundDone(r))) return 'qual';
  const c=resolveCut(computeStandings(S),S.finalists,S.tiebreaks);
  if(c.pending) return 'tie';
  if(S.finalists===1) return 'champion';
  if(!S.finale.length) return 'pickfinal';
  const last=S.finale[S.finale.length-1];
  if(!tableDone(last)) return 'final';
  if(S.headStart>0) return 'champion';
  return winnersOf(last).length===1?'champion':'rematch';
}
function fitsOneTable(g,m){const L=layout(m,g.min,g.max);return !!L&&L.sizes.length===1&&L.byes===0;}

/* Current run of round wins in a row for each player. */
function winStreaks(S){
  const run={};
  S.rounds.forEach(rd=>{if(!roundDone(rd)) return;rd.tables.forEach(t=>{
    const ids=t.ids.filter(id=>t.places[id]!==undefined);if(!ids.length) return;
    const top=Math.min(...ids.map(id=>t.places[id]));ids.forEach(id=>{run[id]=t.places[id]===top?(run[id]||0)+1:0;});});});
  return run;
}
/* Who placed where in every finished round, kept with each saved tournament so the Hall of Fame can look back. */
function roundLog(S){
  const rows=computeStandings(S),out=[];
  S.rounds.forEach(rd=>{
    if(!roundDone(rd)) return;const g=gameOf(S,rd.gameId);
    const tables=rd.tables.map(t=>t.ids.filter(id=>t.places[id]!==undefined).map(id=>{const p=S.players.find(p=>p.id===id),row=rows.find(r=>r.id===id);return {n:p?p.name:'?',r:p&&p.rid,p:t.places[id],v:row&&row.per[rd.id]!==undefined?r1(row.per[rd.id]):0};}));
    out.push({g:g?g.name:'?',w:g?g.weight:1,t:tables});
  });

}

  else fin=last.ids.slice().sort((a,b)=>last.places[a]-last.places[b]).map(id=>({name:nm(id),place:last.places[id],seed:first.ids.indexOf(id)+1}));
  const names=[...new Set(S.rounds.map(r=>{const g=gameOf(S,r.gameId);return g?g.name:'';}))];

    played,rlist,cw:cw%6,best,finalGame:fg?fg.name:'',solo,stars:gauntletStars(S,!solo),runner:rows[1]?rows[1].name:'',margin:rows[1]?r1(me.pts-rows[1].pts):0,scored:!solo&&S.headStart>0,carry:hsCarry(S),final:fin,
    standings:rows.map(r=>{const fp=fin.find(f=>f.name===r.name);return {name:r.name,pts:r.pts,rank:r.rank,place:fp&&Number.isFinite(fp.place)?fp.place:r.rank,fin:!!fp,color:pcol(r.id),look:lookOf(r.id,S),champ:r.id===champ};}),log:roundLog(S),
    rounds:S.rounds.length,players:S.players.length,games:names.length,
    mins:S.rounds.reduce((a,r)=>{const g=gameOf(S,r.gameId);return a+(g?roundMinutes(g,r.tables.length,r.tables.some(t=>t.ids.length>g.max)):0);},0)};
}
/* Saved tournaments pick up settings and games added later. */
function ensureDefaults(S){
  S.roster=S.roster||[];
  /* typed-in past gauntlets: the one logged round must credit the real champion (an earlier version credited the wrong player on some) */
  (S.archive||[]).forEach(a=>{const T=a&&a.data;if(!a||!/^past-/.test(a.id||'')||!T||!T.champ||!T.standings||!T.log||!T.log.length) return;
    const g=T.log[0].g,cn=String(T.champ.name).trim().toLowerCase();
    T.log=[{g:g,w:T.log[0].w||1,t:[T.standings.map(q=>{const win=String(q.name).trim().toLowerCase()===cn;return {n:q.name,p:win?1:2,v:win?10:4.2};})]}];
    T.standings.forEach(q=>{q.place=String(q.name).trim().toLowerCase()===cn?1:2;});});
  S.slots=(S.slots||[]).filter(x=>x&&x.snap).slice(0,12);
  S.trash=(S.trash||[]).filter(t=>t&&t.payload&&Date.now()-t.at<6048e5).slice(0,20);
  if(!S.rv){S.rv=1;
    const add=n=>{n=String(n||'').trim();if(!n||/^Player \d+$/.test(n)) return null;let e=S.roster.find(r=>r.name.toLowerCase()===n.toLowerCase());if(!e){e={rid:'r'+(S.rseq=(S.rseq||0)+1),name:n};S.roster.push(e);}return e;};
    (S.players||[]).forEach(p=>{const e=add(p.name);if(e) p.rid=e.rid;});
    (S.archive||[]).forEach(a=>{const T=a&&a.data;if(T&&T.standings) T.standings.forEach(q=>add(q.name));});
  }
  S.archive=S.archive||[]; S.nightHours=S.nightHours||3; if(S.howLong===undefined){S.howLong=2;S.howManual=true;} if(S.winnerStays===undefined) S.winnerStays=true; if(S.order===undefined) S.order=S.heavyLast===false?'list':'smart'; delete S.heavyLast; S.bkNights=S.bkNights||0; if(S.headStart===undefined) S.headStart=0.5; if(!S.hv){S.hv=1;if(!S.finale.length&&S.headStart===0.5) S.headStart=HS_CARRY;}
  S.games.forEach(g=>{if(!g.copies) g.copies=1;});
  if(!S.gv){
    S.gv=1;
    DEFAULT_GAMES.forEach((d,i)=>{
      if(S.games.some(g=>g.id===d.id)) return;
      const prev=i>0?S.games.findIndex(g=>g.id===DEFAULT_GAMES[i-1].id):-1;
      const copy={...d};
      if(prev>=0) S.games.splice(prev+1,0,copy); else S.games.push(copy);
    });
  }
  return S;
}

let CATALOG=null;
const normName=s=>s.toLowerCase().replace(/['\u2019]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
function catalog(){
  if(!CATALOG) CATALOG=CATALOG_RAW.trim().split('\n').map(l=>{const [n,a,b,m,w,lk,kw]=l.split('|');return {n,min:+a,max:+b,mins:+m,w:+w,luck:+lk,k:normName(n),kw:kw||''};});
  return CATALOG;
}
function catSearch(q){
  q=normName(q); if(q.length<2) return [];
  const toks=q.split(' '), out=[];
  for(const g of catalog()){
    let sc=0;
    const hay=g.k+' '+g.kw;
    if(g.k.startsWith(q)) sc=3; else if((' '+g.k).includes(' '+q)) sc=2; else if(g.k.includes(q)||toks.every(x=>hay.includes(x))) sc=1;
    if(sc) out.push([sc,g]);
  }
  out.sort((a,b)=>b[0]-a[0]||a[1].n.length-b[1].n.length);
  return out.slice(0,12).map(x=>x[1]);
}

let docRef=null,writing=false,dirty=false,timer=null;
function setStatus(s){
  const el=document.getElementById('status');if(!el) return;
  if(VIEW){el.textContent=viewMsg||'Loading…';return;}
  const base=s==='synced'?'Saved to this page. Anyone you share it with sees the same tournament.':'Saved on this device.';
  el.textContent=base+(ghNote?' '+ghNote:'');
}
function touch(){
  if(VIEW) return;
  if(S.started&&phaseOf(S)==='champion'){if(!S.finishedAt) S.finishedAt=Date.now();} else delete S.finishedAt;
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  ghSchedule();sbSchedule();
  if(docRef){dirty=true;clearTimeout(timer);timer=setTimeout(flush,500);}
  if(typeof rosterPush==='function') rosterPush();
}
async function flush(){
  if(writing||!docRef||!dirty) return;
  writing=true;dirty=false;
  try{await docRef.set({json:JSON.stringify(S),t:S.t});setStatus('synced');}catch(e){setStatus('local');}
  writing=false;
  if(dirty){clearTimeout(timer);timer=setTimeout(flush,500);}
}
async function initDb(){
  try{
    const db=await (window.claude&&window.claude.use?window.claude.use('db'):null);
    if(!db) return;
    docRef=db.doc('tournament/main');
    docRef.onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.hasPendingWrites) return;
      if(!snap.exists){if(S.t>0){dirty=true;flush();}return;}
      const d=snap.data(); if(!d||!d.json) return;
      if(d.t>S.t){
        try{
          const o=JSON.parse(d.json);
          if(o&&o.v===1){S=ensureDefaults(o);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} if(!ui.touched) ui.view=S.started?'rounds':'setup'; renderSafe();}
        }catch(e){}
      }else if(d.t<S.t){dirty=true;clearTimeout(timer);timer=setTimeout(flush,300);}
      setStatus('synced');
    },()=>setStatus('local'));
  }catch(e){}
}

function anchorSave(name,blob){
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
}
function toast(t){const el=document.getElementById('status');if(!el) return;el.textContent=t;clearTimeout(ui.tt);ui.tt=setTimeout(()=>setStatus(),4500);}
function nightMarks(){
  if(!S.started) return 0;
  const nights=nightsOf().nights; let k=0;
  for(const nt of nights){
    let all=true;
    for(let i=nt.from;i<nt.from+nt.count;i++) if(!roundDone(S.rounds[i])){all=false;break;}
    if(all) k++; else break;
  }
  return k+(phaseOf(S)==='champion'?1:0);
}
/* readable JSON for data.json and backup files: indented down to the rounds and tables, compact below that */
function prettyJSON(v,depth,max){
  depth=depth||0;max=max||4;const pad=n=>'  '.repeat(n);
  if(v===null||typeof v!=='object'||depth>=max) return JSON.stringify(v);
  if(Array.isArray(v)){
    if(!v.length) return '[]';
    return '[\n'+v.map(x=>pad(depth+1)+prettyJSON(x,depth+1,max)).join(',\n')+'\n'+pad(depth)+']';
  }
  const k=Object.keys(v).filter(q=>v[q]!==undefined);
  if(!k.length) return '{}';
  return '{\n'+k.map(q=>pad(depth+1)+JSON.stringify(q)+': '+prettyJSON(v[q],depth+1,max)).join(',\n')+'\n'+pad(depth)+'}';
}
async function exportBackup(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name='game-night-gauntlet-backup-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json';
  const marks=nightMarks(), at=Date.now();
  const snap=JSON.parse(JSON.stringify(S));snap.bkNights=marks;snap.bkAt=at;
  const text=prettyJSON(snap);
  let dl=null;try{dl=await (window.claude&&window.claude.use?window.claude.use('downloads'):null);}catch(e){}
  if(dl) await dl.save({filename:name,data:text});
  else anchorSave(name,new Blob([text],{type:'application/json'}));
  S.bkNights=marks;S.bkAt=at;
  try{localStorage.setItem('ubg-bk',String(at));}catch(e){}
  touch();
  return name;
}

const HS_OPTS=[[0,'Final only'],[0.5,'Small bonus'],[HS_CARRY,'Keep points']];
function headStartText(m,q,ids,S0){
  if(m<2) return 'With one finalist there is no final game.';
  if(q===HS_CARRY){
    let pool=10*FINAL_W, qp=null, rows=null;
    if(ids&&S0){rows=computeStandings(S0);qp=ids.map(id=>(rows.find(r=>r.id===id)||{pts:0}).pts);pool=Math.max(pool,Math.ceil(qp[0]-qp[m-1])+10);}
    const pay=Array.from({length:m},(_,k)=>fmt(pool*(m-1-k)/(m-1))).join(' / ');
    let t=`Qualifying points carry into the final. The final pays ${pay} points for 1st to last${ids&&S0?'':' (at least 20 for first, more when the finalists are far apart so the title is never settled early)'}, added to each finalist's qualifying total. The highest combined total wins, and a tie goes to the higher seed.`;
    if(qp){
      const reach=headStartReach(m,q,qp,pool), names=ids.map(id=>(rows.find(r=>r.id===id)||{name:'?'}).name);
      t+=' '+reach.map((p,i)=>names[i]+' ('+fmt(qp[i])+') '+(p<1?'cannot catch up':p===1?'must win':'can finish '+ord(p)+' or better')).join('; ')+'.';
    }
    return t;
  }
  if(q<=0) return 'Clean slate: the final game alone decides the champion. A tie for first means a rematch.';
  const b=finalBonuses(m,q), reach=headStartReach(m,q);
  const starts=b.map((v,i)=>'seed '+(i+1)+' +'+fmt(v)).join(', ');
  const worst=reach.map((p,i)=>'seed '+(i+1)+' '+(p<1?'none':ord(p))).join(', ');
  return `The final pays ${Array.from({length:m},(_,k)=>fmt(10*FINAL_W*(m-1-k)/(m-1))).join(' / ')} points for 1st to last, and qualifying rank adds a head start (${starts}). Lowest finish that can still win: ${worst}. Ties go to the higher seed.`;
}

const QTIPS={

function hsBullets(m,q){
  const pay=Array.from({length:m},(_,k)=>fmt(10*FINAL_W*(m-1-k)/(m-1))).join(' / ');
  if(q===HS_CARRY) return ['Points from the rounds carry into the final.','The final adds '+pay+' points for 1st to last (more if the finalists are far apart).','Highest combined total wins. A tie goes to whoever ranked higher.'];
  if(q<=0) return ['Clean slate: only the final game counts.','A tie for first means a tiebreaker rematch.'];

  return ['The final pays '+pay+' points for 1st to last.','Small bonus for top ranks: '+b.map((v,i)=>'rank '+(i+1)+' +'+fmt(v)).join(', ')+'.','A tie goes to whoever ranked higher.'];

function rosterSync(p){

  const other=S.roster.find(r=>r.name.toLowerCase()===nm.toLowerCase());
  if(other&&!S.players.some(q=>q!==p&&q.rid===other.rid)){
    p.rid=other.rid;if(other.look&&!p.look) p.look={...other.look};else if(p.look&&JSON.stringify(p.look)!==JSON.stringify(other.look)){other.look={...p.look};other.t=Date.now();}return;

/* ---------- rounds ---------- */
function viewRounds(){
  if(!S.started) return empty('No rounds yet','Pick players and games in Setup, then build the rounds.',`<p><button type="button" class="btn primary" data-act="tab" data-a="setup">Go to setup</button></p>`);
  const cur=S.rounds.findIndex(r=>!roundDone(r));
  const {mins,nights}=nightsOf();
  const nightAt={}; nights.forEach((nt,k)=>nightAt[nt.from]={k,nt});
  const cards=S.rounds.map((r,i)=>{
    const g=gameOf(S,r.gameId), done=roundDone(r);
    const open=ui.open[r.id]!==undefined?ui.open[r.id]:i===cur;
    const tdone=r.tables.filter(tableDone).length;
    let sub;
    if(done){const w=[];r.tables.forEach(t=>t.ids.forEach(id=>{if(t.places[id]===1)w.push(pname(id));}));sub=`<small class="done">Won by ${esc(w.join(' · '))}</small>`;}
    else sub=`<small>${tdone?tdone+' of '+r.tables.length+' scored':(i===cur?'In play':'Up next')} · about ${hm(mins[i])}</small>`;
    let body='';
    {
      const k=r.tables.length, copies=copiesOf(g);
      body=`<div class="rb">${k>copies?`<p class="bye">${k} tables but ${copies} ${copies===1?'copy':'copies'} of ${esc(g.name)}, so they take turns.</p>`:''}${r.tables.map((t,ti)=>tableBlock('r',r.id,ti,t,g.weight,t.ids.length>g.max?'Winner stays':(k>1?(g.min===2&&g.max===2?'Match ':'Table ')+(ti+1):''))).join('')}
        ${r.tables.some(t=>t.ids.length>g.max)?`<p class="bye">Winner stays: two players start. The winner stays on and plays whoever sat out, and so on. First to 2 wins is 1st. The other two rank by wins, and level wins share the place.</p>`:''}
        ${r.byes.length?`<p class="bye">Sitting out: ${esc(r.byes.map(pname).join(', '))}. ${done?'Each gets +'+fmt(5*g.weight)+', half marks, the same as an average result.':'They get half marks when the round finishes, the same as an average result.'}</p>`:''}
        </div>`;
      body=`<div class="rbw"><div class="rbi">${body}</div></div>`;
    }
    const nh=nightAt[i]?`<div class="night"><h3 class="chip c-purple">Night ${nightAt[i].k+1}</h3><span class="muted">${nightAt[i].nt.count} round${nightAt[i].nt.count>1?'s':''}, about ${hm(nightAt[i].nt.mins)}</span></div>`:'';
    return `${nh}<article class="round${open?' open':''}${i===cur?' cur':''}" id="rd-${r.id}"><button type="button" class="rh" data-act="open" data-a="${r.id}" aria-expanded="${open}">
      <span class="rn s${i%6}">${i+1}</span><span class="rt"><b>${esc(g.name)}</b>${(()=>{const q=repInfo(S,r);return q.m>1?` <span class="rrep">round ${q.n} of ${q.m}</span>`:'';})()}${sub}</span><span class="chev"></span></button>${body}</article>`;
  }).join('');
  const choices=S.games.filter(g=>layout(S.players.length,g.min,g.max)).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');
  const add=S.finale.length?'':`<details class="card add"><summary>Add a round</summary><div class="addgrid"><label class="fld wide"><span>Game</span><select class="sel" id="ar-game">${choices}</select></label></div>
    <p style="margin-top:12px"><button type="button" class="btn shine" data-act="addround">Add to the end</button></p></details>`;
  const redrawable=S.finale.length?0:S.rounds.filter(r=>roundUnscored(r)&&(r.tables.length>1||r.byes.length)).length;
  const totalMin=mins.reduce((a,b)=>a+b,0);
  const n=S.players.length, sumTxt=S.finalists===1?`${n} players · ${S.rounds.length} rounds · points leader wins`:`${n} players · ${S.rounds.length} rounds · top ${S.finalists} play the final`;
  const locked=S.finale.length?`<li>The final has started, so round results are locked.</li>`:'';
  const rules=`<details class="grules" data-ui="rulesOpen"${ui.rulesOpen?' open':''}><summary><span class="gt"><b>Gauntlet rules</b><span>${esc(sumTxt)}</span></span><span class="chev"></span></summary><div class="gbody"><ul class="bul">
    <li>${S.rounds.length} rounds, about ${hm(totalMin)} in all, over ${nights.length} game night${nights.length===1?'':'s'} of ${S.nightHours||3} hours.</li>
    <li>Tap each player's finishing place. Yellow is first, and the same number twice is a tie.</li>
    <li>First place earns about 10 points and last earns 0, then the game's weight multiplies it.</li>
    <li>Small tables are eased toward the middle, so a 2-player match can't swing the board more than a 6-player game.</li>
    <li>Games with one copy take turns.</li>
    <li>Seats are drawn at random, avoiding repeat opponents and rotating sit-outs.</li>${locked}</ul></div></details>`;
  const noScores=!S.rounds.some(r=>r.tables.some(hasPlaces))&&!S.finale.length;
  const howto=noScores?`<div class="card tip"><b>How to score</b><p class="muted">Tap each player's finishing place. Yellow is 1st. Give two players the same number for a tie. The next round opens by itself.</p></div>`:'';
  return `${howto}${rules}${redrawable?`<p><button type="button" class="btn" data-act="redrawall">Reshuffle seats in all unscored rounds</button></p>`:''}${cards}${add}`;
}

/* ---------- standings ---------- */
function mqInit(){

    const d=el.scrollWidth-el.parentElement.clientWidth+6;

  });
}
function viewStandings(){
  if(!S.started) return empty('Standings begin with round one','Build the rounds in Setup first.',`<p><button type="button" class="btn primary" data-act="tab" data-a="setup">Go to setup</button></p>`);
  const rows=computeStandings(S), ph=phaseOf(S), cut=resolveCut(rows,S.finalists,S.tiebreaks);
  const fin=new Set(cut.finalists||[]), tied=new Set(ph==='tie'&&cut.group?cut.group:[]);
  const max=Math.max(1,...rows.map(r=>r.pts)),streaks=winStreaks(S),none=!rows.some(r=>r.pts>0);
  let list='';
  rows.forEach((r,i)=>{
    list+=`<li class="srow${r.rank===1&&r.pts>0?' lead':''}${fin.has(r.id)&&ph!=='qual'?' fin':''}${tied.has(r.id)?' tied':''}" data-id="${r.id}"><span class="rk r${Math.min(r.rank,4)} mono">${none?'–':r.rank}</span>
      <span class="who"><span class="nm">${pdot(r.id)}${esc(r.name)}${tied.has(r.id)?'<span class="tag">TIED</span>':''}${streaks[r.id]>=2?`<span class="flame" title="${streaks[r.id]} round wins in a row" aria-label="${streaks[r.id]} round wins in a row">${FLAMESVG}${streaks[r.id]}</span>`:''}</span><span class="bar"><i style="width:${(r.pts/max*100).toFixed(1)}%;background:${pcol(r.id)}"></i></span></span>
      <span class="pts mono">${fmt(r.pts)}</span><span class="mini mono">${r.wins}</span><span class="mini mono">${r.played}</span></li>`;
    if(!none&&i===S.finalists-1&&rows.length>S.finalists) list+=`<li class="cutline" role="presentation"><span>Top ${S.finalists} reach the final</span></li>`;
  });
  /* Round by round: rounds run down the page, players across, so there is no sideways scrolling. */
  const shorts=(()=>{const nm=rows.map(r=>r.name.replace(/\s+/g,''));const out={};
    for(const k of [3,4,5]){const c=nm.map(n=>n.slice(0,k));if(new Set(c).size===c.length){rows.forEach((r,x)=>out[r.id]=c[x]);return out;}}
    const ini=rows.map(r=>{const w=r.name.trim().split(/\s+/);const d=(r.name.match(/\d+\s*$/)||[''])[0].trim();return (w[0][0]||'?').toUpperCase()+(d||(w[1]?w[1][0].toUpperCase():''));});
    if(new Set(ini).size===ini.length){rows.forEach((r,x)=>out[r.id]=ini[x]);return out;}
    rows.forEach((r,x)=>out[r.id]='P'+(x+1));return out;})();
  const tiedIn=(rd,id)=>{for(const t of rd.tables){if(t.places[id]!==undefined) return t.ids.filter(x=>t.places[x]===t.places[id]).length>1;}return false;};
  let anyTie=false;
  const plc=(rd,id)=>{for(const t of rd.tables){if(t.places[id]!==undefined) return t.places[id];}return null;};
  const mth=rows.map(r=>`<th scope="col" title="${esc(r.name)}"><span class="mxh">${pdot(r.id)}<span>${esc(shorts[r.id])}</span></span></th>`).join('');

    const g=gameOf(S,rd.gameId),q=repInfo(S,rd),label=(g?g.name:'?')+(q.m>1?' '+q.n:'');

  }).join('');
  const mtot=`<tr class="mxt"><th scope="row">Total</th>${rows.map(r=>`<td class="mono">${rows.length>=7?Math.round(r.pts):fmt(r.pts)}</td>`).join('')}</tr>`;
  const matrix=`<table class="mx2" style="--n:${rows.length}"><thead><tr><th></th>${mth}</tr></thead><tbody>${mbody}${mtot}</tbody></table>`;
  const note=ph==='tie'?`<div class="card warn"><h3>Tie at the cut line</h3><p>${esc(cut.group.map(pname).join(', '))} finished level on points. A tiebreaker game decides who gets the last ${cut.pending.spots===1?'spot':cut.pending.spots+' spots'} in the final.</p><p><button type="button" class="btn" data-act="tab" data-a="finale">Go to the tiebreaker</button></p></div>`:'';
  const dc=prevChamp(S),defend=dc&&ph!=='champion'?`<div class="card tip"><b>${CROWNSVG} Defending champion: ${esc(dc)}</b><p class="muted">Winning again earns a crown victory.</p></div>`:'';

  return `${note}${wait}${defend}${podiumHTML(rows)}<section class="card flat"><ul class="slist"><li class="shead" role="presentation"><span>#</span><span>Player</span><span>Pts</span><span>Wins</span><span>Played</span></li>${list}</ul></section>

}


const FLAMESVG='<svg class="fl" width="14" height="16" viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="#3B3540" stroke-width="6" stroke-linejoin="round"><path d="M32 4c3 10 16 16 16 32a16 16 0 0 1-32 0c0-8 4-11 6-15 1 4 3 6 5 6 0-9-1-15 5-23z" fill="#FF8A78"/><path d="M32 36c3 3 6 5.500 6 10a6 6 0 0 1-12 0c0-4.500 3-7 6-10z" fill="#FFD84D" stroke-width="4"/></svg>';
function podiumHTML(rows){

function gameOptions(m){return S.games.filter(g=>fitsOneTable(g,m)).sort((a,b)=>a.mins-b.mins);}

  }
  if(ph==='pickfinal'){

    out+=`<div class="card"><h2>Choose the final game</h2><p class="muted">Games that seat exactly ${m} players. Suggested ones take about half an hour and let skill beat luck.</p>
      <ul class="bul">${hsBullets(m,S.headStart||0).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
      <div>${opts.sort((a,b)=>score(b)-score(a)).map(g=>`<div class="cand"><div class="info"><b>${esc(g.name)}${top.has(g.id)?'<span class="badge">Suggested</span>':''}</b><small class="mono">${g.mins} min · luck ${g.luck} of 5</small></div><button type="button" class="btn${top.has(g.id)?' primary':''}" data-act="finpick" data-a="${g.id}">Play this</button></div>`).join('')}</div>
      ${opts.length?'':`<p class="muted">No game on the list seats ${m} players. Add one in Setup.</p>`}</div>`;

  const scored=S.headStart>0&&first&&tableDone(first)?finalScores(S,first):null;
  if(ph==='champion'){
    const w=finalWinner(S), solo=S.finalists===1, g=solo?null:gameOf(S,S.finale[0].gameId), stars=gauntletStars(S,!solo);
    const line=solo&&S.players.length===2?`Won the duel after ${S.rounds.length} round${S.rounds.length===1?'':'s'}.`:solo?`Led the standings after ${S.rounds.length} round${S.rounds.length===1?'':'s'}.`:scored?`Won the final at ${g?g.name:'the final game'} with ${fmt(scored[0].total)} points.`:`Won the final at ${g?g.name:'the final game'}.`;
    const ro=typeof VIEW!=='undefined'&&VIEW,cr=crownNow(S),pc=prevChamp(S);
    const crownCard=(ro&&!cr)?'':`<div class="card crowncard"><div class="cardhead"><h2 class="chip c-yellow">Crown victory</h2>${ro?'':`<button type="button" class="btn sm${cr?' primary':''}" data-act="crownv" aria-pressed="${cr}">${cr?'Ticked':'Tick off'}</button>`}</div><p class="muted">${cr?`${CROWNSVG} ${esc(pname(w))} wins the title again as defending champion.`:pc?`${esc(pc)} won the last gauntlet. A crown victory goes to a defending champion who wins again.`:'A crown victory goes to a defending champion who wins again. The host can tick it if it applies.'}</p></div>`;
    out=`<div class="card gold champ">${meeple(pcol(w),72,lookOf(w))}<div class="txt"><span class="lbl">${S.players.length===2?'Duel Champion':'Ultimate Board Gamer'}</span><span class="name">${esc(pname(w))}</span>${stars?`<span class="stars" aria-label="${stars}-star gauntlet">${'★'.repeat(stars)}</span>`:''}<p>${esc(line)}</p></div></div>${crownCard}
      <div class="card" id="trophy-card"><div class="cardhead"><h2 class="chip c-yellow">Keepsake trophy</h2><span class="muted">Tap the picture or Share</span></div>
        <div class="twrap"><img id="trophy-img" class="trophy" alt="Trophy preview for ${esc(pname(w))}. Tap to save to Photos." data-act="photo" role="button" tabindex="0" style="cursor:pointer" hidden><div class="tglint" hidden></div></div>
        <div class="rfoot"><button type="button" class="btn primary" data-act="share">Share trophy</button></div>

      <div class="card"${VIEW?' hidden':''}><h3>Done with this gauntlet?</h3><p class="muted">Saves it to History with its trophy and clears the rounds. Players stay, and the game list goes back to the original staples.</p><p><button type="button" class="btn" data-act="newt">Start a new gauntlet</button></p></div>`+out;

      const g=gameOf(S,f.gameId);
      let subs=null;
      if(S.headStart>0&&i===0){const b=hsCarry(S)?f.ids.map(id=>(rows.find(r=>r.id===id)||{pts:0}).pts):finalBonuses(f.ids.length,S.headStart);subs={};f.ids.forEach((id,s)=>{subs[id]='Rank '+(s+1)+' · starts '+(hsCarry(S)?'at ':'+')+fmt(b[s]);});}

      if(i===0&&scored){
        out+=`<div class="card"><h3>Final scores</h3>${scored.map((x,k)=>`<div class="pr"><div class="pn"><span class="nm">${pdot(x.id)}${esc(pname(x.id))}${k===0?'<span class="badge">Champion</span>':''}</span><span class="pp mono">${ord(x.place)} place +${fmt(x.base)} · ${hsCarry(S)?'points from rounds':'bonus'} +${fmt(x.bonus)}</span></div><span class="pts mono">${fmt(x.total)}</span></div>`).join('')}</div>`;
      }

  }
  const resolved=S.tiebreaks.filter(tb=>ph!=='tie'||!(cut.pending&&cut.pending.tb&&cut.pending.tb.id===tb.id));
  resolved.forEach(tb=>{
    const g=gameOf(S,tb.gameId);
    out+=`<div class="card"><h3>Tiebreaker · ${esc(g?g.name:'')}</h3>${tableBlock('t',tb.id,0,tb,0,'')}</div>`;
  });
  return out;
}

/* ---------- history ---------- */
function resultLines(t,w){

  return t.ids.slice().sort((a,b)=>t.places[a]-t.places[b]).map(id=>`<div class="hl2"><span class="hp mono">${t.places[id]}${t.ids.filter(x=>t.places[x]===t.places[id]).length>1?'<sup class="tq" title="Tied">=</sup>':''}</span>${pdot(id)}<span class="nm">${esc(pname(id))}</span>${pts?`<span class="pp2 mono">+${fmt(pts[id]*w)}</span>`:''}</div>`).join('');

/* ---------- Hall of Fame: fun records from every saved tournament, rotating every 10 seconds ---------- */
function statsList(){
  const arch=S.archive.slice().reverse(),T=arch.map(a=>a.data&&{...a.data,imp:/^past-/.test(a.id||'')}).filter(Boolean),out=[];
  const R=T.filter(t=>!t.imp); /* typed-in past gauntlets only carry a winner and crown, so they count for titles, streaks and crowns, not for points, margins, rounds or runner-ups. Their one logged round (winner plus everyone tied 2nd) does count for game records. */
  const add=(p,icon,head,body,src)=>out.push({p,icon,head,body,src});
  const key=n=>String(n||'').trim().toLowerCase();
  const dstr2=ts=>{try{return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}catch(e){return '';}};
  const verbH=(a,one,many)=>a.length===1?one:many;
  const nl=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
  const tops=(keys,f)=>{let m=-Infinity;keys.forEach(k=>{const v=f(k);if(v>m)m=v;});return keys.filter(k=>Math.abs(f(k)-m)<1e-9);};
  const topT=(arr,f)=>{let m=-Infinity;arr.forEach(t=>{const v=f(t);if(v>m)m=v;});return arr.filter(t=>Math.abs(f(t)-m)<1e-9);};
  const uniqNames=arr=>{const sn=new Set(),o=[];arr.forEach(n=>{const k=key(n);if(!sn.has(k)){sn.add(k);o.push(n);}});return o;};
  /* tournament records */
  if(T.length){
    const cnt={},disp={};T.forEach(t=>{const k=key(t.champ.name);cnt[k]=(cnt[k]||0)+1;disp[k]=t.champ.name;});
    const topk=tops(Object.keys(cnt),k=>cnt[k]);
    if(topk.length&&cnt[topk[0]]>=2){const n=cnt[topk[0]],nm=nl(topk.map(k=>disp[k]));add(90+n,'trophy','Most gauntlet titles',topk.length===1?`${nm} has won ${n} Game Night Gauntlets`:`${nm} have each won ${n} Game Night Gauntlets`);}
    const cc={},cd={};T.forEach(t=>{if(t.crown){const k=key(t.champ.name);cc[k]=(cc[k]||0)+1;cd[k]=t.champ.name;}});
    const ckk=tops(Object.keys(cc),k=>cc[k]);
    if(ckk.length){const n=cc[ckk[0]],nm=nl(ckk.map(k=>cd[k])),pl=n===1?'crown victory':'crown victories';add(97+n,'crown','Crown victories',ckk.length===1?`${nm} has ${n} ${pl}, winning the title again as defending champion`:`${nm} each have ${n} ${pl}, winning the title again as defending champion`);}
    const last=T[T.length-1];
    add(cnt[key(last.champ.name)]>=2?47:52,'crown','Reigning champion',`${last.champ.name} took the latest gauntlet on ${dstr2(last.date)}`);
    {const runs=[];let run=0;T.forEach((t,i)=>{run=i>0&&key(T[i-1].champ.name)===key(t.champ.name)?run+1:1;runs.push({n:t.champ.name,len:run,end:i});});
      const best=Math.max(...runs.map(r=>r.len)),tr=runs.filter(r=>r.len===best);
      if(best>=2){const names=uniqNames(tr.map(r=>r.n)),liveN=uniqNames(tr.filter(r=>r.end===T.length-1).map(r=>r.n));
        add(95+best,'flame','Title streak',names.length===1?`${names[0]} won ${best} gauntlets in a row${liveN.length?' and is still going':''}`:`${nl(names)} each won ${best} gauntlets in a row${liveN.length?` (${nl(liveN)} still going)`:''}`);}}

function playedLines(x,T,maxW,maxLines){
  const names=(T.played&&T.played.length)?T.played:[];
  if(!names.length) return [];
  const lines=[];let cur='',used=0;
  for(let i=0;i<names.length;i++){
    const part=(cur?' · ':'')+names[i];
    if(x.measureText(cur+part).width>maxW&&cur){
      lines.push(cur);cur='';
      if(lines.length>=maxLines){break;}
      cur=names[i];
    }else cur+=part;
    used=i+1;
  }
  if(lines.length<maxLines&&cur){lines.push(cur);used=names.length;}
  if(used<names.length){
    let last=lines[lines.length-1],more=' · +'+(names.length-used)+' more';
    while(x.measureText(last+more).width>maxW&&last.includes(' · ')) last=last.slice(0,last.lastIndexOf(' · '));

    lines[lines.length-1]=last+' · +'+left+' more';
  }
  return lines;
}

async function ghPublish(){
  ghTimer=null;
  if(VIEW) return;
  if(ghBusy){ghPending=true;return;}
  if(!GH.token||!GH.repo){ghNote='Add your repo and token to publish.';setStatus();return;}
  ghBusy=true;ghNote='Publishing…';setStatus();
  const url='https://api.github.com/repos/'+GH.repo+'/contents/data.json';
  const H={Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  let ok=false;
  try{
    const snapshot=prettyJSON(cleanData(S));
    for(let tries=0;tries<3&&!ok;tries++){
      let sha;
      const g=await fetch(url+'?ref='+encodeURIComponent(GH.branch)+'&t='+Date.now(),{headers:H,cache:'no-store'});
      if(g.ok) sha=(await g.json()).sha;
      else if(g.status===401||g.status===403) throw new Error('auth');
      else if(g.status!==404) throw new Error('http '+g.status);
      const body={message:'Update gauntlet',content:btoa(unescape(encodeURIComponent(snapshot))),branch:GH.branch};
      if(sha) body.sha=sha;
      const p=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify(body)});
      if(p.ok){ok=true;ghNote='Published to GitHub at '+clock()+'.';}
      else if(p.status===401||p.status===403) throw new Error('auth');
      else if(p.status===404) throw new Error('repo');
      else if(p.status!==409&&p.status!==422) throw new Error('http '+p.status);
    }
    if(!ok) ghNote='GitHub was busy. It will try again on the next change.';
  }catch(e){
    ghNote=e.message==='auth'?'GitHub refused it. Check the token and that it allows Contents read and write.':e.message==='repo'?'Repo or branch not found. Check the spelling.':'Could not publish, probably offline. It will try again on the next change.';
  }
  ghBusy=false;setStatus();
  if(ghPending){ghPending=false;ghSchedule();}
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-homeb]');if(!b) return;
  const k=b.dataset.homeb;if(k!=='delslot'&&k!=='rdel') homeDel=null;
  const fail=t=>{homeErr=t;const el=document.getElementById('home-msg');if(el)el.textContent=t;};
  if(k==='vopen'){homeOpen=false;homeMark();homeSync();}
  else if(k==='open'){ui.gmenu=false;homeOpen=true;homeErr='';render();homeSync();runSplash(1500);}
  else if(k==='cont'){homeOpen=false;homeMark();homeSync();}
  else if(k==='delslot'){
    const id=b.dataset.a;
    if(homeDel!==id){homeDel=id;homeSync();return;}
    homeDel=null;
    const i=(S.slots||[]).findIndex(x=>x.id===id);
    if(i>=0){const e=S.slots.splice(i,1)[0];trashPush('slot',e.name||gLabel(e.snap),{slot:e});touch();toast('Deleted. Restore it from Recently deleted for 7 days.');}
    homeSync();
  }
  else if(k==='rdel'){
    const c=b.dataset.a;
    if(homeDel!==c){homeDel=c;homeSync();return;}
    homeDel=null;
    try{const tok=await auToken();if(tok) await sbRpc('delete_my_gauntlet',{p_code:c},tok);}catch(err){fail('Could not delete that one. Check the connection and try again.');}
    homeRemote=null;homeSync();
  }
  else if(k==='slot'){act('gopen',[b.dataset.a],null);homeOpen=false;homeMark();render();homeSync();}
  else if(k==='recover'){
    fail('Opening…');
    try{
      if(await recoverOpen(b.dataset.a)){homeOpen=false;homeMark();render();homeSync();}
      else fail('Could not open that gauntlet. Try signing in again.');
    }catch(err){fail('Could not reach the server. Check the connection and try again.');}
  }
  else if(k==='new'){
    if(S.started){try{act('gnew',[],null);}catch(err){}}
    homeOpen=false;homeMark();ui.view='setup';ui.top=true;ui.gmenu=false;render();homeSync();
  }else if(k==='join'){
    const raw=(document.getElementById('home-code').value||'').trim();
    let mode='',code='';
    let m=raw.match(/[?&]join=([A-Za-z0-9]{6})/);if(m){mode='v';code=m[1];}
    if(!mode){m=raw.match(/[?&]admin=([A-Za-z0-9-]{12,})/);if(m){mode='a';code=m[1];}}
    if(!mode){const s=raw.replace(/[^A-Za-z0-9]/g,'');if(s.length===6){mode='v';code=s;}else if(s.length>=16){mode='a';code=s;}}
    if(!mode){fail('That does not look right. A viewer code has 6 characters and an admin code has 16.');return;}
    code=code.replace(/-/g,'').toUpperCase();
    if(mode==='v'){location.href=location.pathname+'?join='+code;return;}
    fail('Looking…');
    try{
      if(await adminOpen(code)){homeOpen=false;homeMark();render();homeSync();}
      else fail('No gauntlet matches that admin code.');
    }catch(err){fail('Could not reach the server. Check the connection and try again.');}
  }
});

let lkBusy=false;
async function lookPull(){
  if(VIEW||!S.share||!S.share.ok||lkBusy) return;
  lkBusy=true;
  try{
    const lk=await sbRpc('get_looks',{p_code:S.share.code})||{};let ch=false;
    Object.keys(lk).forEach(pid=>{
      const v=lk[pid],p=S.players.find(x=>x.id===pid);
      if(!p||!v||!v.look||(v.t||0)<=(p.lookT||0)) return;
      const nl={...v.look};p.lookT=v.t;
      if(JSON.stringify(p.look||{})===JSON.stringify(nl)) return;
      p.look=nl;const e=p.rid&&(S.roster||[]).find(r=>r.rid===p.rid);if(e){e.look={...nl};e.t=Date.now();}
      propagateLook(p.name,nl);ch=true;
    });
    if(ch){touch();if(!document.activeElement||document.activeElement.tagName!=='INPUT') render();}
  }catch(e){}
  lkBusy=false;
}

const vlKey=()=>'ubg-me-'+JOIN;

function vlFlush(){
  if(!vlTimer) return;clearTimeout(vlTimer);vlTimer=null;
  const pid=vl.pid,look=vl.look;if(!pid||!look) return;
  sbRpc('set_player_look',{p_code:JOIN,p_pid:pid,p_look:look}).then(()=>{
    sbChan(JOIN).then(ch=>ch.send({type:'broadcast',event:'ping',payload:{l:1}})).catch(()=>{});
  }).catch(()=>{toast('Could not save your game piece. Check the connection and try again.');});
}
document.addEventListener('click',e=>{
  if(!VIEW) return;
  const o=e.target.closest('[data-vlookopen]');
  if(o){
    if(!(S.players&&S.players.length)){toast('The host has not added players yet.');return;}
    let me=null;try{me=localStorage.getItem(vlKey());}catch(err){}
    const p=me&&vlFind(me);vl.on=true;vl.pid=p?p.id:null;vl.look=p?{...(p.look||{})}:null;vlSync();return;
  }
  const b=e.target.closest('[data-vk]');if(!b) return;
  const k=b.dataset.vk,a=b.dataset.va||'';
  if(k==='close'||k==='look'){vlFlush();vl.on=false;vlSync();return;}
  if(k==='pick'){const p=vlFind(a);if(!p) return;vl.pid=a;vl.look={...(p.look||{})};try{localStorage.setItem(vlKey(),a);}catch(err){}vlSync();return;}
  if(k==='swap'){vlFlush();vl.pid=null;vl.look=null;vlSync();return;}
  if(/^look[chips]$/.test(k)&&vl.pid){
    const n=+a.split('|')[1];if(!Number.isFinite(n)) return;
    if(k==='lookp'&&PAT_STAR(n)>bestStars()) return;
    vl.look[{lookc:'c',lookh:'h',looki:'i',lookp:'p',looks:'s'}[k]]=n;
    const p=vlFind(vl.pid);if(p){p.look={...vl.look};p.lookT=Date.now();}
    vLooks[vl.pid]={look:{...vl.look},t:Date.now()};
    clearTimeout(vlTimer);vlTimer=setTimeout(()=>vlFlush(),600);
    vlSync();renderSafe();
  }
});
let viewBusy=false,viewLoaded=false;
async function viewPoll(){
  if(JOIN){
    if(viewBusy) return;viewBusy=true;
    try{
      const rows=await sbRpc('get_gauntlet',{p_code:JOIN});
      if(!rows||!rows.length) viewMsg='No gauntlet found for code '+JOIN+'. Check the link.';
      else{
        const o=rows[0].data;
        if(o&&o.v===1){
          viewMsg='Updated '+new Date(rows[0].updated_at).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})+'. This page refreshes by itself.';
          let lk={};try{lk=await sbRpc('get_looks',{p_code:JOIN})||{};}catch(err){}
          applyLooks(o,lk);const sig=JSON.stringify(lk);
          if(vlTimer) {/* a change is being saved: keep the local copy */}
          else if(o.t!==S.t||sig!==vSig){vSig=sig;if(!viewLoaded){viewLoaded=true;ui.fxPhase=undefined;ui.fxDone=null;} /* the first load is not a live moment: no confetti or fanfare for a gauntlet that finished earlier */
            S=ensureDefaults(o);renderSafe();if(vl.on) vlSync();}
        }
      }
    }catch(e){viewMsg='Could not reach the live copy right now. Trying again.';}
    viewBusy=false;setStatus();return;
  }
  try{
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(r.status===404) viewMsg='The host has not published a gauntlet yet.';
    else if(r.ok){
      const o=await r.json();
      if(o&&o.v===1){
        viewMsg='Updated '+new Date(o.t||Date.now()).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})+'. This page refreshes by itself.';
        if(o.t!==S.t){S=ensureDefaults(o);renderSafe();}
      }
    }
  }catch(e){viewMsg='Could not reach the page right now. Trying again.';}
  setStatus();
}

      const c=document.createElement('button');c.type='button';c.className='gmb vcopy';c.setAttribute('data-vcopy','1');c.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.700l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"/></svg><span>Copy viewer link</span>';hb2.appendChild(c);const sn=document.getElementById('snd');if(sn) hb2.appendChild(sn);}
    try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
    setStatus();

    const pull=async()=>{
      if(!ghAutoOn()||ghTimer||ghBusy) return;

    });
  }

/* update notice: when a newer build is published, offer a refresh */
(function(){
  const B='1792992917';let shown=false,last=0;
  const show=()=>{if(shown)return;shown=true;const d=document.createElement('div');d.className='updbar';d.setAttribute('role','status');d.innerHTML='<span>A new version is ready.</span><button type="button" class="btn sm">Refresh</button>';d.querySelector('button').addEventListener('click',()=>location.reload());document.body.appendChild(d);};
  const go=()=>{let t=0;try{t=+sessionStorage.getItem('ubg-rl')||0;}catch(e){}if(Date.now()-t<120000) return false;try{sessionStorage.setItem('ubg-rl',String(Date.now()));}catch(e){}location.reload();return true;};
  const chk=async(auto)=>{if(shown||Date.now()-last<30000)return;last=Date.now();try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const o=await r.json();if(o&&o.v&&o.v!==B){if(auto&&go())return;show();}}catch(e){}};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk(true);});
  setTimeout(()=>chk(true),4000);
  setInterval(()=>chk(VIEW),300000);
})();
