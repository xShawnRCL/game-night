<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Night Gauntlet</title>
<meta name="theme-color" content="#F6F0E2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gauntlet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column styled like a game-box insert. Beige table, chunky outlined cards, bright pawn colors as highlights. */
:root{
  --bg:#F6F0E2; --surface:#FDFAF2; --raise:#FFFFFF; --ink:#2D2A32; --muted:#5F584D;
  --edge:#3B3540; --line:#E3D9C2; --shadow:#3B3540; --on-bright:#2D2A32; --good:#1F7A4D;
  --c-yellow:#FFD84D; --c-coral:#FF8A78; --c-blue:#7CC6F5; --c-green:#7ED9A6; --c-purple:#C4A8F7; --c-orange:#FFB05C; --c-pink:#F7A8CF;
  --warn-bg:#FFE1DA; --warn-ink:#A7311F;
  color-scheme:light;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'DM Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);padding-inline:16px;padding-block:20px 64px;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.meeple{flex:none;display:block;overflow:visible}
h1{font:800 clamp(2.2rem,10vw,3.4rem)/0.92 var(--f-display);letter-spacing:-0.03em;margin:0;text-wrap:balance}
h1 .hl{background:linear-gradient(transparent 60%,var(--c-yellow) 60%);padding-inline:2px}
.tagline{margin-top:6px;font-weight:700;color:var(--muted)}
h2{font:700 1.25rem/1.15 var(--f-display);letter-spacing:-0.01em;margin:0;text-wrap:balance}
h2.chip{display:inline-block;padding:3px 14px;border:2px solid var(--edge);border-radius:999px;box-shadow:0 2px 0 var(--shadow);color:var(--on-bright);font-size:1.1rem}
.c-blue{background:var(--c-blue)}.c-yellow{background:var(--c-yellow)}.c-green{background:var(--c-green)}.c-coral{background:var(--c-coral)}.c-purple{background:var(--c-purple)}
h3{font:700 1rem/1.2 var(--f-display);margin:0}
p{margin:0}
.sub{margin-top:10px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.9rem;max-width:62ch}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--c-blue);outline-offset:2px}

/* board track */
.road{display:flex;gap:4px;align-items:center;margin-top:16px;padding-top:4px}
.road i{flex:1;min-width:6px;height:18px;border-radius:6px;background:var(--surface);border:2px solid var(--line)}
.road i.done{background:var(--sc);border-color:var(--edge)}
.road i.cur{background:var(--raise);border-color:var(--edge);transform:translateY(-3px);box-shadow:0 3px 0 var(--shadow)}
.road i.fin{flex:0 0 30px;height:26px;border-radius:8px;border-color:var(--edge);position:relative}
.road i.fin::after{content:"★";position:absolute;inset:0;display:grid;place-items:center;font-size:.85rem;font-style:normal;color:var(--edge)}
.road i.fin.done{background:var(--c-yellow)}
.roadlbl{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:.82rem;font-weight:700;color:var(--muted)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;margin-top:14px;padding-block:10px;background:var(--bg)}
.tab{flex:1 1 auto;min-width:0;padding:9px 6px;border:2px solid transparent;border-radius:12px;background:transparent;font-weight:700;font-size:clamp(.72rem,3.6vw,.92rem);color:var(--muted);white-space:nowrap;text-align:center}
.tab[aria-current="page"]{color:var(--on-bright);border-color:var(--edge);box-shadow:0 3px 0 var(--shadow)}
.t-setup[aria-current="page"]{background:var(--c-blue)}
.t-rounds[aria-current="page"]{background:var(--c-green)}
.t-standings[aria-current="page"]{background:var(--c-yellow)}
.t-finale[aria-current="page"]{background:var(--c-coral)}
main{padding-top:10px;display:flex;flex-direction:column;gap:18px}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border:2px solid var(--edge);border-radius:12px;background:var(--raise);font-weight:700;box-shadow:0 3px 0 var(--shadow)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn.primary{background:var(--c-yellow);color:var(--on-bright)}
.btn.danger{background:var(--raise);color:var(--warn-ink)}
.btn.danger.armed{background:var(--c-coral);color:var(--on-bright)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line);color:var(--muted)}
.btn.sm{padding:5px 11px;font-size:.85rem;border-radius:10px;box-shadow:0 2px 0 var(--shadow)}
.btn.ghost.sm{box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.inp,.sel{width:100%;min-width:0;padding:9px 11px;border:2px solid var(--edge);border-radius:10px;background:var(--raise);color:var(--ink);font:inherit}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* cards */
.card{background:var(--surface);border:2px solid var(--edge);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 0 var(--shadow)}
.card.flat{padding:0;gap:0;overflow:hidden}
.card.warn{background:var(--warn-bg)}
.card.gold{background:var(--c-yellow);color:var(--on-bright)}
.card.gold .muted{color:var(--on-bright)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* pawns */
.pawn{display:inline-block;width:19px;height:19px;margin-right:6px;vertical-align:-4px;overflow:visible;flex:none}

/* setup */
.plist,.glist,.slist{list-style:none;margin:0;padding:0}
.plist{display:flex;flex-direction:column;gap:8px}
.prow2{display:flex;align-items:center;gap:8px}
.pnum{width:1.6rem;color:var(--muted);text-align:right}
.seg{display:inline-flex;border:2px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--raise)}
.seg button{padding:6px 12px;border:0;border-right:2px solid var(--edge);background:transparent;font-weight:700;font-family:var(--f-mono)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--c-yellow);color:var(--on-bright)}
.glist{display:flex;flex-direction:column}
.game{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:2px dashed var(--line)}
.game:first-child{border-top:0}
.game.off .gname,.game.off .gmeta{opacity:.5}
.gname{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}
.gname input{width:20px;height:20px;accent-color:var(--c-green);flex:none}
.gname span{min-width:0;overflow-wrap:anywhere}
.gmeta{grid-column:1;font-size:.8rem;color:var(--muted);padding-left:30px}
.gplan{grid-column:1;font-size:.85rem;padding-left:30px}
.gplan.bad{color:var(--warn-ink);font-weight:700}
.gctl{grid-column:2;grid-row:1 / span 3;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mv{display:flex;gap:4px}
.wt{display:inline-block;padding:1px 8px;border:2px solid var(--edge);border-radius:8px;background:var(--c-green);color:var(--on-bright);font:700 .8rem var(--f-mono);box-shadow:0 2px 0 var(--shadow)}
.wt.w2{background:var(--c-blue)}.wt.w3{background:var(--c-coral)}
details.add summary{cursor:pointer;font-weight:700}
.addgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px}
.addgrid .fld.wide{grid-column:1 / -1}
.plan{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.plan strong{font:800 1.6rem var(--f-display)}

/* rounds */
.round{background:var(--surface);border:2px solid var(--edge);border-radius:16px;overflow:hidden;box-shadow:0 4px 0 var(--shadow)}
.round.cur{background:var(--raise)}
.rh{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:transparent;text-align:left}
.rn{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:2px solid var(--edge);background:var(--c-blue);color:var(--on-bright);font:800 1rem var(--f-display);box-shadow:0 2px 0 var(--shadow)}
.rn.s0{background:var(--c-coral)}.rn.s1{background:var(--c-blue)}.rn.s2{background:var(--c-yellow)}.rn.s3{background:var(--c-green)}.rn.s4{background:var(--c-purple)}.rn.s5{background:var(--c-orange)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt b{font:700 1.1rem/1.2 var(--f-display);overflow-wrap:anywhere}
.rt small{color:var(--muted);font-size:.82rem}
.rt small.done{color:var(--good);font-weight:700}
.chev{flex:none;width:9px;height:9px;border-right:3px solid var(--edge);border-bottom:3px solid var(--edge);transform:rotate(45deg);margin:0 4px 3px 2px}
.round.open .chev{transform:rotate(-135deg);margin-bottom:-3px}
.rb{padding:0 14px 16px;display:flex;flex-direction:column;gap:14px}
.tb{display:flex;flex-direction:column;border:2px solid var(--edge);border-radius:12px;background:var(--raise);overflow:hidden}
.tbh{padding:6px 12px;background:var(--c-blue);color:var(--on-bright);font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-bottom:2px solid var(--edge)}
.pr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-top:2px dashed var(--line)}
.tb>.pr:first-child,.tbh+.pr{border-top:0}
.pn{min-width:0;display:flex;flex-direction:column}
.nm{font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.pp{font-size:.8rem;color:var(--good);font-weight:700;padding-left:22px}
.chips{display:flex;gap:3px;flex:none}
.pl{width:36px;height:36px;padding:0;border:2px solid var(--line);border-radius:10px;background:var(--surface);font:700 .95rem var(--f-mono);color:var(--muted)}
.pl.on{border-color:var(--edge);color:var(--on-bright);background:var(--c-pink);box-shadow:0 2px 0 var(--shadow)}
.pl.on.p1{background:var(--c-yellow)}.pl.on.p2{background:var(--c-blue)}.pl.on.p3{background:var(--c-coral)}.pl.on.p4{background:var(--c-green)}.pl.on.p5{background:var(--c-purple)}.pl.on.p6{background:var(--c-orange)}
.bye{font-size:.88rem;color:var(--muted)}
.rfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* standings */
.slist{display:flex;flex-direction:column}
.shead,.srow{display:grid;grid-template-columns:30px minmax(0,1fr) 3.6rem 2.4rem 2.4rem;gap:8px;align-items:center;padding:10px 14px}
.shead{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-block:8px;background:var(--bg);border-bottom:2px solid var(--edge)}
.shead span:nth-child(n+3),.srow>span:nth-child(n+3){text-align:right}
.srow{border-top:2px dashed var(--line)}
.shead+.srow{border-top:0}
.rk{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);font:800 .95rem var(--f-display);color:var(--muted)}
.rk.r1{background:var(--c-yellow);border-color:var(--edge);color:var(--on-bright)}
.rk.r2{background:var(--c-blue);border-color:var(--edge);color:var(--on-bright)}
.rk.r3{background:var(--c-coral);border-color:var(--edge);color:var(--on-bright)}
.who{display:flex;flex-direction:column;gap:5px;min-width:0}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;display:block}
.bar i{display:block;height:100%;border-radius:4px}
.pts{font-weight:700;font-size:1.05rem}
.mini{color:var(--muted);font-size:.9rem}
.cutline{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-bright);background:var(--c-yellow);border-block:2px solid var(--edge)}
.cutline::before,.cutline::after{content:"";flex:1;border-top:2px dashed var(--edge)}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;border:2px solid var(--edge);background:var(--c-coral);color:var(--on-bright);font:700 .68rem var(--f-mono);letter-spacing:.04em;vertical-align:middle}
.scroll{overflow-x:auto;border:2px solid var(--edge);border-radius:12px;background:var(--raise)}
.mx{border-collapse:collapse;width:100%;font-size:.85rem}
.mx th,.mx td{padding:8px 10px;text-align:right;white-space:nowrap;border-top:2px dashed var(--line)}
.mx thead th{border-top:0;background:var(--bg);font-weight:700;color:var(--muted)}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--raise)}
.mx thead th:first-child{background:var(--bg)}
.mx small{display:block;color:var(--good);font-family:var(--f-mono)}
.mx td.none{color:var(--muted)}

/* finale */
.cand{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:2px dashed var(--line)}
.cand:first-child{border-top:0}
.cand .info{min-width:0;display:flex;flex-direction:column;gap:2px}
.cand .info b{overflow-wrap:anywhere}
.cand small{color:var(--muted)}
.badge{display:inline-block;margin-left:6px;padding:0 7px;border-radius:6px;background:var(--c-green);color:var(--on-bright);border:2px solid var(--edge);font:700 .68rem var(--f-mono);letter-spacing:.04em;text-transform:uppercase;vertical-align:middle}
.seeds{display:flex;flex-wrap:wrap;gap:8px}
.seed{display:flex;align-items:center;padding:5px 12px;border:2px solid var(--edge);border-radius:999px;background:var(--raise);font-weight:700}
.seed .mono{color:var(--muted);margin-right:8px;font-weight:700}
.champ{display:flex;flex-direction:row;align-items:center;gap:16px}
.champ .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.champ .lbl{font:700 .8rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.champ .name{font:800 clamp(2.2rem,11vw,3.6rem)/0.95 var(--f-display);letter-spacing:-0.03em;overflow-wrap:anywhere}
.foot{margin-top:28px;font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.pl,.btn,.tab{transition:background-color .12s,transform .08s}}
@media (max-width:420px){.shead,.srow{grid-template-columns:30px minmax(0,1fr) 3.2rem 2rem 2rem;gap:6px;padding-inline:10px}.meeple{width:46px;height:46px}}

/* v6 additions */
.night{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0 8px}
.night .muted{font-size:.88rem}
.cp{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.85rem}
.cp button{width:28px;height:28px;border:2px solid var(--edge);border-radius:8px;background:var(--raise);font-weight:800;line-height:1}
.stack{display:flex;flex-direction:column;gap:12px}
.hist{display:flex;flex-direction:column;gap:6px}
.hl2{display:flex;align-items:center;gap:8px}
.hp{flex:none;width:1.6em;font-family:var(--f-mono);font-weight:700}
.pp2{margin-left:auto;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbh2{font-weight:700;font-size:.85rem;color:var(--muted);margin-top:4px}
.trophy{display:block;width:100%;height:auto;border:2px solid var(--edge);border-radius:12px;background:#fff;box-shadow:0 4px 0 var(--shadow)}
.small{font-size:.85rem}
.t-history[aria-current="page"]{background:var(--c-purple)}
@media (max-width:350px){.tab{padding-inline:3px;font-size:.68rem}.tabs{gap:2px}}

/* v8 additions */
.bk{border-color:var(--edge);background:var(--c-yellow);margin-bottom:14px}
.bk .muted{color:var(--on-bright)}
.catres{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.catit{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;border:2px solid var(--edge);border-radius:12px;background:var(--raise);text-align:left;box-shadow:0 2px 0 var(--shadow)}
.catit:disabled{opacity:.55;box-shadow:none}
.catit span{font-size:.8rem;color:var(--muted)}
.cats{margin-bottom:0}

/* GitHub Pages build */
body.view [data-act]{pointer-events:none}
body.view [data-act="tab"],body.view [data-act="open"],body.view [data-act="trophy"],body.view [data-act="ptrophy"]{pointer-events:auto}
body.view .btn:not([data-act="trophy"]):not([data-act="ptrophy"]){display:none}
.share .fld{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.85rem;margin-top:10px}
.share .chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:700;font-size:.9rem}
.share .chk input{width:20px;height:20px}
.share .linkbox{margin-top:6px;padding:8px 10px;border:2px dashed var(--line);border-radius:10px;word-break:break-all;font-size:.8rem;background:var(--raise)}
.share h3{margin-top:18px}
.share .rfoot{margin-top:10px;justify-content:flex-start}
.share .hint{margin-top:8px}
</style>

const DEFAULT_GAMES=[
  {id:'ek',name:'Exploding Kittens',short:'EK',min:2,max:5,weight:1,mins:15,luck:5,on:true},

  {id:'7w',name:'7 Wonders',short:'7W',min:3,max:7,weight:2,mins:40,luck:2,on:true},

  {id:'uno',name:'Uno',short:'Uno',min:2,max:10,weight:1,mins:20,luck:5,on:true},
  {id:'unoteams',name:'Uno Teams',short:'UnoT',min:4,max:4,weight:1,mins:20,luck:4,on:false},
  {id:'unogolf',name:'Uno Golf',short:'UnoG',min:2,max:6,weight:1,mins:25,luck:4,on:false},
  {id:'unoflip',name:'Uno Flip',short:'UnoF',min:2,max:10,weight:1,mins:20,luck:5,on:false},
  {id:'uno99',name:'Uno 99',short:'U99',min:2,max:6,weight:1,mins:20,luck:4,on:false},

let CATALOG=null;
const normName=s=>s.toLowerCase().replace(/['\u2019]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
function catalog(){
  if(!CATALOG) CATALOG=CATALOG_RAW.trim().split('\n').map(l=>{const [n,a,b,m,w,lk,kw]=l.split('|');return {n,min:+a,max:+b,mins:+m,w:+w,luck:+lk,k:normName(n),kw:kw||''};});
  return CATALOG;
}
function catSearch(q){
  q=normName(q); if(q.length<2) return [];
  const toks=q.split(' '), out=[];
  for(const g of catalog()){
    let sc=0;
    const hay=g.k+' '+g.kw;
    if(g.k.startsWith(q)) sc=3; else if((' '+g.k).includes(' '+q)) sc=2; else if(g.k.includes(q)||toks.every(x=>hay.includes(x))) sc=1;
    if(sc) out.push([sc,g]);
  }
  out.sort((a,b)=>b[0]-a[0]||a[1].n.length-b[1].n.length);
  return out.slice(0,12).map(x=>x[1]);
}

/* ---------- saving: this device always, shared page store when available ---------- */
let docRef=null,writing=false,dirty=false,timer=null;
function setStatus(s){
  const el=document.getElementById('status');if(!el) return;
  if(VIEW){el.textContent=viewMsg||'Loading…';return;}
  const base=s==='synced'?'Saved to this page. Anyone you share it with sees the same tournament.':'Saved on this device.';
  el.textContent=base+(ghNote?' '+ghNote:'');
}
function touch(){
  if(VIEW) return;
  if(S.started&&phaseOf(S)==='champion'){if(!S.finishedAt) S.finishedAt=Date.now();} else delete S.finishedAt;
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  ghSchedule();
  if(docRef){dirty=true;clearTimeout(timer);timer=setTimeout(flush,500);}
}
async function flush(){
  if(writing||!docRef||!dirty) return;
  writing=true;dirty=false;
  try{await docRef.set({json:JSON.stringify(S),t:S.t});setStatus('synced');}catch(e){setStatus('local');}
  writing=false;
  if(dirty){clearTimeout(timer);timer=setTimeout(flush,500);}
}
async function initDb(){
  try{
    const db=await (window.claude&&window.claude.use?window.claude.use('db'):null);
    if(!db) return;
    docRef=db.doc('tournament/main');
    docRef.onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.hasPendingWrites) return;
      if(!snap.exists){if(S.t>0){dirty=true;flush();}return;}
      const d=snap.data(); if(!d||!d.json) return;
      if(d.t>S.t){
        try{
          const o=JSON.parse(d.json);
          if(o&&o.v===1){S=ensureDefaults(o);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} if(!ui.touched) ui.view=S.started?'rounds':'setup'; renderSafe();}
        }catch(e){}
      }else if(d.t<S.t){dirty=true;clearTimeout(timer);timer=setTimeout(flush,300);}
      setStatus('synced');
    },()=>setStatus('local'));
  }catch(e){}
}


/* ---------- backups: asked for at the end of every game night ---------- */
function anchorSave(name,blob){
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
}
function toast(t){const el=document.getElementById('status');if(!el) return;el.textContent=t;clearTimeout(ui.tt);ui.tt=setTimeout(()=>setStatus(),4500);}
function nightMarks(){
  if(!S.started) return 0;
  const nights=nightsOf().nights; let k=0;
  for(const nt of nights){
    let all=true;
    for(let i=nt.from;i<nt.from+nt.count;i++) if(!roundDone(S.rounds[i])){all=false;break;}
    if(all) k++; else break;
  }
  return k+(phaseOf(S)==='champion'?1:0);
}
async function exportBackup(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name='game-night-gauntlet-backup-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json';
  const marks=nightMarks(), at=Date.now();
  const snap=JSON.parse(JSON.stringify(S));snap.bkNights=marks;snap.bkAt=at;
  const text=JSON.stringify(snap);
  let dl=null;try{dl=await (window.claude&&window.claude.use?window.claude.use('downloads'):null);}catch(e){}
  if(dl) await dl.save({filename:name,data:text});
  else anchorSave(name,new Blob([text],{type:'application/json'}));
  S.bkNights=marks;S.bkAt=at;
  try{localStorage.setItem('ubg-bk',String(at));}catch(e){}
  touch();
  return name;
}
function backupBanner(){
  if(typeof VIEW!=='undefined'&&VIEW) return '';
  if(!S.started) return '';
  const m=nightMarks();
  if(m<=(S.bkNights||0)||ui.bkLater===m) return '';
  const title=phaseOf(S)==='champion'?'The tournament is finished.':'Night '+m+' is done.';

}

function headStartText(m,q){
  if(q<=0) return 'Clean slate: the final game alone decides the champion. A tie for first means a rematch.';
  const b=finalBonuses(m,q), reach=headStartReach(m,q);
  const starts=b.map((v,i)=>'seed '+(i+1)+' +'+fmt(v)).join(', ');
  const worst=reach.map((p,i)=>'seed '+(i+1)+' '+(p<1?'none':ord(p))).join(', ');
  return `The final pays ${Array.from({length:m},(_,k)=>fmt(10*FINAL_W*(m-1-k)/(m-1))).join(' / ')} points for 1st to last, and qualifying rank adds a head start (${starts}). Lowest finish that can still win: ${worst}. Ties go to the higher seed.`;
}

  const nightAt={}; nights.forEach((nt,k)=>nightAt[nt.from]={k,nt});
  const cards=S.rounds.map((r,i)=>{
    const g=gameOf(S,r.gameId), done=roundDone(r);
    const open=ui.open[r.id]!==undefined?ui.open[r.id]:i===cur;
    const tdone=r.tables.filter(tableDone).length;
    let sub;
    if(done){const w=[];r.tables.forEach(t=>t.ids.forEach(id=>{if(t.places[id]===1)w.push(pname(id));}));sub=`<small class="done">Won by ${esc(w.join(' · '))}</small>`;}
    else sub=`<small>${tdone?tdone+' of '+r.tables.length+' scored':(i===cur?'In play':'Up next')} · about ${hm(mins[i])}</small>`;
    let body='';
    if(open){
      const k=r.tables.length, copies=copiesOf(g);
      body=`<div class="rb">${k>copies?`<p class="bye">${k} tables but ${copies} ${copies===1?'copy':'copies'} of ${esc(g.name)}, so they take turns.</p>`:''}${r.tables.map((t,ti)=>tableBlock('r',r.id,ti,t,g.weight,t.ids.length>g.max?'Winner stays':(g.min===2&&g.max===2?'Match '+(ti+1):(k>1?'Table '+(ti+1):'')))).join('')}
        ${r.tables.some(t=>t.ids.length>g.max)?`<p class="bye">Winner stays: two players start. The winner stays on and plays whoever sat out, and so on. First to 2 wins is 1st. The other two rank by wins, and level wins share the place.</p>`:''}
        ${r.byes.length?`<p class="bye">Sitting out: ${esc(r.byes.map(pname).join(', '))}. ${done?'Each gets +'+fmt(5*g.weight)+', half marks, the same as an average result.':'They get half marks when the round finishes, the same as an average result.'}</p>`:''}
        ${!S.finale.length&&!r.tables.some(hasPlaces)?`<div class="rfoot">${(r.tables.length>1||r.byes.length)?`<button type="button" class="btn sm" data-act="redraw" data-a="${r.id}">Re-draw seats</button>`:''}<button type="button" class="btn sm ghost" data-act="delround" data-a="${r.id}">Remove this round</button></div>`:''}</div>`;
    }
    const nh=nightAt[i]?`<div class="night"><h3 class="chip c-purple">Night ${nightAt[i].k+1}</h3><span class="muted">${nightAt[i].nt.count} round${nightAt[i].nt.count>1?'s':''}, about ${hm(nightAt[i].nt.mins)}</span></div>`:'';
    return `${nh}<article class="round${open?' open':''}${i===cur?' cur':''}" id="rd-${r.id}"><button type="button" class="rh" data-act="open" data-a="${r.id}" aria-expanded="${open}">
      <span class="rn s${i%6}">${i+1}</span><span class="rt"><b>${esc(g.name)}</b>${sub}</span><span class="wt w${g.weight}">×${g.weight}</span><span class="chev"></span></button>${body}</article>`;
  }).join('');
  const choices=S.games.filter(g=>layout(S.players.length,g.min,g.max)).map(g=>`<option value="${g.id}">${esc(g.name)} (×${g.weight})</option>`).join('');
  const add=S.finale.length?'':`<details class="card add"><summary>Add a round</summary><div class="addgrid"><label class="fld wide"><span>Game</span><select class="sel" id="ar-game">${choices}</select></label></div>
    <p style="margin-top:12px"><button type="button" class="btn" data-act="addround">Add to the end</button></p></details>`;
  const redrawable=S.finale.length?0:S.rounds.filter(r=>roundUnscored(r)&&(r.tables.length>1||r.byes.length)).length;
  const totalMin=mins.reduce((a,b)=>a+b,0);
  return `<p class="hint">${S.rounds.length} rounds, about ${hm(totalMin)} in all, split into ${nights.length} game night${nights.length===1?'':'s'} of ${S.nightHours||3} hours. Games with one copy take turns. Tap each player's finishing place. Yellow is first. The same number twice is a tie. First place earns about 10 points and last earns 0, then the game's weight multiplies it. Small tables are eased toward the middle so a 2-player match can't swing the board more than a 6-player game. Seats are drawn at random, and the draw avoids repeat opponents and rotates sit-outs.</p>${redrawable?`<p><button type="button" class="btn" data-act="redrawall">Re-draw all unscored rounds</button></p>`:''}${cards}${add}`;
}

/* ---------- standings ---------- */
function viewStandings(){

  const rows=computeStandings(S), ph=phaseOf(S), cut=resolveCut(rows,S.finalists,S.tiebreaks);
  const fin=new Set(cut.finalists||[]), tied=new Set(ph==='tie'&&cut.group?cut.group:[]);
  const max=Math.max(1,...rows.map(r=>r.pts));
  let list='';
  rows.forEach((r,i)=>{
    list+=`<li class="srow${r.rank===1&&r.pts>0?' lead':''}${fin.has(r.id)&&ph!=='qual'?' fin':''}"><span class="rk r${Math.min(r.rank,4)} mono">${r.rank}</span>
      <span class="who"><span class="nm">${pdot(r.id)}${esc(r.name)}${tied.has(r.id)?'<span class="tag">TIED</span>':''}</span><span class="bar"><i style="width:${(r.pts/max*100).toFixed(1)}%;background:${pcol(r.id)}"></i></span></span>
      <span class="pts mono">${fmt(r.pts)}</span><span class="mini mono">${r.wins}</span><span class="mini mono">${r.played}</span></li>`;

  });
  const hdr=S.rounds.map(r=>{const g=gameOf(S,r.gameId);return `<th title="${esc(g.name)}">${esc(g.short||g.name.slice(0,5))}<small>×${g.weight}</small></th>`;}).join('');
  const body=rows.map(r=>`<tr><td>${esc(r.name)}</td>${S.rounds.map(rd=>r.per[rd.id]!==undefined?`<td class="mono">${fmt(r.per[rd.id])}</td>`:`<td class="mono none">–</td>`).join('')}<td class="mono"><b>${fmt(r.pts)}</b></td></tr>`).join('');
  const note=ph==='tie'?`<div class="card warn"><h3>Tie at the cut line</h3><p>${esc(cut.group.map(pname).join(', '))} finished level on points. A playoff decides who gets the last ${cut.pending.spots===1?'spot':cut.pending.spots+' spots'} in the final.</p><p><button type="button" class="btn" data-act="tab" data-a="finale">Go to the playoff</button></p></div>`:'';
  return `${note}<section class="card flat"><ul class="slist"><li class="shead" role="presentation"><span>#</span><span>Player</span><span>Pts</span><span>Wins</span><span>Played</span></li>${list}</ul></section>
    <section class="card"><h3>Round by round</h3><div class="scroll"><table class="mx"><thead><tr><th>Player</th>${hdr}<th>Total</th></tr></thead><tbody>${body}</tbody></table></div></section>`;
}

  resolved.forEach(tb=>{

/* ---------- history ---------- */
function resultLines(t,w){

}
function viewHistory(){
  const items=[];
  S.rounds.forEach((r,i)=>{if(roundDone(r))items.push({o:i,ts:r.doneAt||0,html:histCard('R'+(i+1),gameOf(S,r.gameId),r.doneAt,r.tables.map((t,ti)=>({label:r.tables.length>1?(gameOf(S,r.gameId).max===2?'Match ':'Table ')+(ti+1):'',t})),gameOf(S,r.gameId).weight,r.byes)});});
  S.tiebreaks.forEach((t,i)=>{if(tableDone(t))items.push({o:1000+i,ts:t.doneAt||0,html:histCard('Playoff',gameOf(S,t.gameId),t.doneAt,[{label:'',t}],0,[])});});
  S.finale.forEach((t,i)=>{if(tableDone(t))items.push({o:2000+i,ts:t.doneAt||0,html:histCard(i===0?'Final':'Rematch',gameOf(S,t.gameId),t.doneAt,[{label:'',t}],0,[])});});
  items.sort((a,b)=>(b.ts-a.ts)||(b.o-a.o));
  const cur=items.length?items.map(x=>x.html).join(''):`<p class="muted">Finished rounds show up here, newest first, with who placed where and the points they earned.</p>`;
  const past=S.archive.length?S.archive.map((a,i)=>{const T=a.data;return `<article class="card gold past"><div class="cardhead"><div><span class="lbl mono">${esc(dstr(T.date))}</span><h3>${esc(T.champ.name)} won</h3></div>${meeple(T.champ.color,44)}</div>
      <p>${esc(T.finalGame)} final · ${T.players} players · ${T.rounds} rounds</p>
      <p class="mono small">${T.standings.map(s=>s.rank+' '+esc(s.name)+' '+fmt(s.pts)).join(' · ')}</p>
      <div class="rfoot"><button type="button" class="btn sm" data-act="ptrophy" data-a="${i}|pdf">Trophy PDF</button><button type="button" class="btn sm" data-act="ptrophy" data-a="${i}|png">Trophy image</button><button type="button" class="btn sm" data-act="ptrophy" data-a="${i}|phone">Phone image</button></div></article>`;}).join(''):`<p class="muted">Finished tournaments are saved here with their trophies.</p>`;
  return `<section class="stack"><h2 class="chip c-purple">This tournament</h2>${cur}</section><section class="stack"><h2 class="chip c-yellow">Past tournaments</h2><p class="muted" id="dl-msg2"></p>${past}</section>`;
}
function histCard(tag,g,ts,tables,w,byes){
  return `<article class="card hist"><div class="cardhead"><h3>${esc(tag)} · ${esc(g?g.name:'')}${w?` <span class="wt w${w}">×${w}</span>`:''}</h3><span class="muted">${ts?esc(dstr(ts,true)):''}</span></div>
    ${tables.map(x=>`<div>${x.label?`<div class="tbh2">${x.label}</div>`:''}${resultLines(x.t,w)}</div>`).join('')}

/*TROPHY-START*/
const CROWN_D='M104 378 L76 170 L188 262 L256 128 L324 262 L436 170 L408 378 Z';
const CROWNC=['#FFD84D','#FF8A78','#7CC6F5','#7ED9A6','#C4A8F7','#FFB05C'];
const crownColor=T=>{let i=(T.cw||0)%CROWNC.length;if(CROWNC[i]===T.champ.color)i=(i+1)%CROWNC.length;return CROWNC[i];};
function drawMeeple(x,px,py,size,color,lw){x.save();x.translate(px,py);x.scale(size/64,size/64);const p=new Path2D(MEEPLE_D);x.fillStyle=color;x.fill(p);x.lineWidth=lw;x.lineJoin='round';x.strokeStyle='#3B3540';x.stroke(p);x.restore();}
function drawCrown(x,px,py,size,color,lw){x.save();x.translate(px,py);x.scale(size/512,size/512);const p=new Path2D(CROWN_D);x.fillStyle=color;x.fill(p);x.lineWidth=lw;x.lineJoin='round';x.strokeStyle='#3B3540';x.stroke(p);x.restore();}
function drawChamp(x,px,py,size,T){
  drawMeeple(x,px,py,size,T.champ.color,3.4);
  const cs=size*0.5;
  drawCrown(x,px+size/2-cs*(256/512),py+size*0.11-cs*(378/512),cs,crownColor(T),24);
}
function playedLines(x,T,maxW,maxLines){
  const names=(T.played&&T.played.length)?T.played:[];
  if(!names.length) return [];
  const lines=[];let cur='',used=0;
  for(let i=0;i<names.length;i++){
    const part=(cur?' · ':'')+names[i];
    if(x.measureText(cur+part).width>maxW&&cur){
      lines.push(cur);cur='';
      if(lines.length>=maxLines){break;}
      cur=names[i];
    }else cur+=part;
    used=i+1;
  }
  if(lines.length<maxLines&&cur){lines.push(cur);used=names.length;}
  if(used<names.length){
    let last=lines[lines.length-1],more=' · +'+(names.length-used)+' more';
    while(x.measureText(last+more).width>maxW&&last.includes(' · ')) last=last.slice(0,last.lastIndexOf(' · '));
    const left=names.length-(last.split(' · ').length+(lines.length-1<0?0:lines.slice(0,-1).reduce((a,l)=>a+l.split(' · ').length,0)));
    lines[lines.length-1]=last+' · +'+left+' more';
  }
  return lines;
}
function trophyStats(T){
  const fin0=T.final.find(f=>f.place===1)||T.final[0];
  return [['TOTAL POINTS',T.champ.pts.toFixed(1),'qualifying rounds'],['ROUND WINS',String(T.champ.wins),'of '+T.champ.played+' rounds played'],['QUALIFYING RANK','#'+T.champ.rank,'of '+T.players+' players'],['BEST ROUND',T.best?'+'+T.best.v.toFixed(1):'-',T.best?T.best.game:''],T.scored?['FINAL SCORE',(T.final.find(f=>f.name===T.champ.name)||fin0).total.toFixed(1),'head start included']:['THE FINAL','1st','at '+T.finalGame]];
}
/* An 8.5 x 5.5 inch page drawn at 300 dpi. */
async function drawTrophy(T){
  const W=2550,H=1650,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  try{await Promise.all(['800 100px "Bricolage Grotesque"','500 40px "DM Sans"','700 40px "JetBrains Mono"'].map(f=>document.fonts.load(f)));}catch(e){}
  const D='"Bricolage Grotesque","Segoe UI",system-ui,sans-serif',B='"DM Sans","Segoe UI",system-ui,sans-serif',M='"JetBrains Mono",ui-monospace,Menlo,monospace';
  const ink='#2D2A32',edge='#3B3540',muted='#5F584D',beige='#F6F0E2',BRC=['#FF8A78','#7CC6F5','#FFD84D','#7ED9A6','#C4A8F7','#FFB05C'];
  const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();};
  const spacing=px=>{if('letterSpacing' in x)x.letterSpacing=px+'px';};
  const font=(wt,size,fam)=>{x.font=wt+' '+size+'px '+fam;};
  const fit=(txt,wt,fam,max,start,min)=>{let s=start;font(wt,s,fam);while(x.measureText(txt).width>max&&s>min){s-=4;font(wt,s,fam);}return s;};
  const ordn=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]);
  x.fillStyle='#FFFFFF';x.fillRect(0,0,W,H);
  rr(54,54,W-108,H-108,70);x.fillStyle=beige;x.fill();x.lineWidth=10;x.strokeStyle=edge;x.stroke();

    case 'nh':S.nightHours=+a[0];touch();break;

    case 'newt':startOver();touch();break;
    case 'place':{
      const [kind,eid,ti,pid,n]=a,t=tableOf(kind,eid,+ti);if(!t) break;
      const rd=kind==='r'?S.rounds.find(r=>r.id===eid):null, holder=rd||t, was=rd?roundDone(rd):tableDone(t);
      const k=+n; if(t.places[pid]===k) delete t.places[pid]; else t.places[pid]=k;
      const now=rd?roundDone(rd):tableDone(t);
      if(now&&!was) holder.doneAt=Date.now(); else if(!now) delete holder.doneAt;
      touch();
      if(rd&&!was&&now&&ui.open[rd.id]===undefined){const i=S.rounds.indexOf(rd);const nx=S.rounds[i+1];if(nx) ui.scrollTo=nx.id;}
      break;
    }
    case 'redraw':if(redrawRound(S,a[0])) touch();break;
    case 'redrawall':if(redrawAll(S)) touch();break;
    case 'delround':{const r=S.rounds.find(r=>r.id===a[0]);if(r&&!r.tables.some(hasPlaces)){S.rounds=S.rounds.filter(x=>x!==r);touch();}break;}
    case 'addround':{const id=document.getElementById('ar-game').value;if(addRound(S,id)){ui.open[S.rounds[S.rounds.length-1].id]=true;touch();}break;}
    case 'tbstart':{
      const cut=resolveCut(computeStandings(S),S.finalists,S.tiebreaks);if(!cut.pending||cut.pending.tb) break;
      const gid=document.getElementById('tb-game').value;
      S.tiebreaks.push({id:'t'+(S.seq++),gameId:gid,ids:cut.pending.ids.slice(),places:{}});touch();break;
    }
    case 'tbundo':S.tiebreaks=S.tiebreaks.filter(t=>t.id!==a[0]);touch();break;
    case 'finpick':{
      const cut=resolveCut(computeStandings(S),S.finalists,S.tiebreaks);if(!cut.finalists) break;
      S.finale.push({id:'f'+(S.seq++),gameId:a[0],ids:cut.finalists.slice(),places:{}});touch();break;
    }
    case 'finundo':S.finale=S.finale.filter(f=>f.id!==a[0]);touch();break;
    case 'rematch':{
      const last=S.finale[S.finale.length-1];if(!last||!tableDone(last)) break;
      S.finale.push({id:'f'+(S.seq++),gameId:document.getElementById('rm-game').value,ids:winnersOf(last),places:{}});touch();break;
    }
    case 'photo':{photoSave();return false;}
    case 'trophy':{const T=trophyData(S);if(T)saveTrophy(T,a[0],'dl-msg');return false;}
    case 'ptrophy':{const e=S.archive[+a[0]];if(e)saveTrophy(e.data,a[1],'dl-msg2');return false;}
  }
  return true;
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled) return;
  if(VIEW&&!VIEW_OK.includes(el.dataset.act)) return;

document.addEventListener('change',e=>{
  if(VIEW) return;
  const el=e.target;
  if(el.dataset&&el.dataset.act==='gtoggle'){const g=gameOf(S,el.dataset.a);if(g){g.on=el.checked;touch();render();}}

document.addEventListener('input',e=>{
  if(VIEW) return;
  const el=e.target;
  if(el.dataset&&el.dataset.act==='setname'){const p=S.players.find(p=>p.id===el.dataset.a);if(p){p.name=el.value.trim()||('Player '+(S.players.indexOf(p)+1));touch();}}

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id!=='cat-q') return;
  const res=document.getElementById('cat-res'); if(!res) return;
  const have=new Set(S.games.map(g=>normName(g.name)));

    return `<button type="button" class="catit" role="option" data-cat="${i}"${dup?' disabled':''}><b>${esc(g.n)}</b><span class="mono">${g.min===g.max?g.min:g.min+'–'+g.max} players · ${g.mins} min · ×${g.w}${dup?' · already in your list':''}</span></button>`;}).join('')
    ||(normName(el.value).length>=2?'<p class="hint">No match. Type its details below instead.</p>':'');
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-cat]'); if(!b||b.disabled) return;

  const nm=document.getElementById('ng-name'); if(nm&&nm.scrollIntoView) nm.scrollIntoView({block:'center'});
});

/* ---------- GitHub Pages layer: the host publishes data.json, viewers read it ---------- */
const VIEW_OK=['tab','open','trophy','ptrophy'];
const GHK='ubg-gh', BKK='ubg-bk';
let GH={};try{GH=JSON.parse(localStorage.getItem(GHK))||{};}catch(e){}
if(!GH.repo&&/\.github\.io$/i.test(location.hostname)){const o=location.hostname.split('.')[0];GH.repo=o+'/'+(location.pathname.split('/')[1]||(o+'.github.io'));}
GH.branch=GH.branch||'main'; if(GH.auto===undefined) GH.auto=true;
let ghNote='',ghTimer=null,ghBusy=false,ghPending=false,viewMsg='';
const ghSave=()=>{try{localStorage.setItem(GHK,JSON.stringify(GH));}catch(e){}};
const ghMsg=t=>{const el=document.getElementById('gh-msg');if(el)el.textContent=t;};
const clock=()=>new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function ghSchedule(){
  if(VIEW||!GH.token||!GH.repo||!GH.auto||!(S.t>0)) return;
  clearTimeout(ghTimer);ghTimer=setTimeout(ghPublish,4000);
}
async function ghPublish(){
  if(VIEW) return;
  if(ghBusy){ghPending=true;return;}
  if(!GH.token||!GH.repo){ghNote='Add your repo and token to publish.';setStatus();return;}
  ghBusy=true;ghNote='Publishing…';setStatus();
  const url='https://api.github.com/repos/'+GH.repo+'/contents/data.json';
  const H={Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  let ok=false;
  try{
    const snapshot=JSON.stringify(S);
    for(let tries=0;tries<3&&!ok;tries++){
      let sha;
      const g=await fetch(url+'?ref='+encodeURIComponent(GH.branch)+'&t='+Date.now(),{headers:H,cache:'no-store'});
      if(g.ok) sha=(await g.json()).sha;
      else if(g.status===401||g.status===403) throw new Error('auth');
      else if(g.status!==404) throw new Error('http '+g.status);
      const body={message:'Update tournament',content:btoa(unescape(encodeURIComponent(snapshot))),branch:GH.branch};
      if(sha) body.sha=sha;
      const p=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify(body)});
      if(p.ok){ok=true;ghNote='Published to GitHub at '+clock()+'.';}
      else if(p.status===401||p.status===403) throw new Error('auth');
      else if(p.status===404) throw new Error('repo');
      else if(p.status!==409&&p.status!==422) throw new Error('http '+p.status);
    }
    if(!ok) ghNote='GitHub was busy. It will try again on the next change.';
  }catch(e){
    ghNote=e.message==='auth'?'GitHub refused it. Check the token and that it allows Contents read and write.':e.message==='repo'?'Repo or branch not found. Check the spelling.':'Could not publish, probably offline. It will try again on the next change.';
  }
  ghBusy=false;setStatus();
  if(ghPending){ghPending=false;ghSchedule();}
}
async function ghRestore(){
  let r;
  if(GH.token&&GH.repo) r=await fetch('https://api.github.com/repos/'+GH.repo+'/contents/data.json?ref='+encodeURIComponent(GH.branch)+'&t='+Date.now(),{headers:{Authorization:'Bearer '+GH.token,Accept:'application/vnd.github.raw+json'},cache:'no-store'});
  else r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('none');
  const o=await r.json();
  if(!(o&&o.v===1)) throw new Error('bad');
  return o;
}
function adopt(o){S=ensureDefaults(o);ui.open={};ui.tkey=null;ui.turl=null;ui.view=S.started?'rounds':'setup';ui.touched=true;ui.top=true;touch();render();}
function viewLink(){return location.origin+location.pathname.replace(/index\.html$/,'')+'?view';}
function shareCard(){
  let bk=0;try{bk=+localStorage.getItem(BKK)||0;}catch(e){}
  const bkt=bk?'Last backup file saved '+new Date(bk).toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'.':'No backup file saved yet.';
  return `<div class="card share"><h2 class="chip c-blue">Share &amp; backup</h2>
    <p class="hint">Publishing puts a copy of the tournament on GitHub so family can follow along with the viewer link. Only this device, with your token, can change anything.</p>
    <label class="fld">GitHub repo<input class="inp" data-gh="repo" value="${esc(GH.repo||'')}" placeholder="yourname/game-night" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="fld">Branch<input class="inp" data-gh="branch" value="${esc(GH.branch||'main')}" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="fld">Access token (stays on this device)<input class="inp" type="password" data-gh="token" value="${esc(GH.token||'')}" placeholder="github_pat_..." autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="chk"><input type="checkbox" data-gh="auto"${GH.auto?' checked':''}> Publish automatically after each change</label>
    <div class="rfoot"><button type="button" class="btn sm primary" data-ghb="publish">Publish now</button><button type="button" class="btn sm ghost" data-ghb="restore">Restore from published copy</button></div>
    <h3>Viewer link</h3>
    <div class="linkbox mono" id="gh-link">${esc(viewLink())}</div>
    <div class="rfoot"><button type="button" class="btn sm" data-ghb="copy">Copy link</button><button type="button" class="btn sm" data-ghb="share">Share…</button></div>
    <h3>Backup file</h3>
    <p class="hint" id="gh-bk">${esc(bkt)} Save one after each game night. If this device ever clears its data, load it back here.</p>
    <div class="rfoot"><button type="button" class="btn sm" data-ghb="export">Export progress</button><button type="button" class="btn sm" data-ghb="import">Import file</button><input type="file" id="gh-file" accept=".json,application/json" hidden></div>
    <p class="hint" id="gh-msg" role="status" aria-live="polite"></p></div>`;
}
document.addEventListener('change',e=>{
  if(VIEW) return;
  const el=e.target;
  if(el.dataset&&el.dataset.gh){
    const k=el.dataset.gh;GH[k]=el.type==='checkbox'?el.checked:el.value.trim();
    if(k==='repo') GH.repo=GH.repo.replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/,'').replace(/\/+$/,'');
    ghSave();ghMsg('Saved.');if(k==='token'||k==='repo'||k==='auto') ghSchedule();
  }
  if(el.id==='gh-file'&&el.files&&el.files[0]){
    const f=el.files[0];el.value='';
    f.text().then(t=>{
      const o=JSON.parse(t);
      if(!(o&&o.v===1&&Array.isArray(o.players))) throw new Error('bad');
      if(S.started&&!confirm('Replace the tournament on this device with the one in that file?')) return;
      adopt(o);
    }).catch(()=>ghMsg('That file is not a Game Night Gauntlet backup.'));
  }
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-ghb]');if(!b||VIEW) return;
  const k=b.dataset.ghb;
  try{
    if(k==='publish'){
      if(!(S.t>0)){ghMsg('Nothing to publish yet.');return;}
      ghMsg('Publishing…');clearTimeout(ghTimer);await ghPublish();ghMsg(ghNote);
    }else if(k==='restore'){
      ghMsg('Looking for the published copy…');
      const o=await ghRestore();
      if(S.started&&!confirm('Replace the tournament on this device with the published copy?')){ghMsg('');return;}
      adopt(o);
    }else if(k==='copy'){
      await navigator.clipboard.writeText(viewLink());ghMsg('Link copied.');
    }else if(k==='share'){
      if(navigator.share) await navigator.share({title:'Game Night Gauntlet',url:viewLink()});
      else{await navigator.clipboard.writeText(viewLink());ghMsg('Link copied.');}
    }else if(k==='export'){
      await exportBackup();
      document.getElementById('gh-bk')&&(document.getElementById('gh-bk').textContent='Backup saved just now. Save one after each game night. If this device ever clears its data, load it back here.');
      ghMsg('Backup saved. Look in your Downloads or Files app.');
    }else if(k==='import'){
      document.getElementById('gh-file').click();
    }
  }catch(err){
    if(err&&err.name==='AbortError') return;
    ghMsg(k==='restore'?'No published copy found yet.':'That did not work on this device.');
  }
});
async function viewPoll(){
  try{
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(r.status===404) viewMsg='The host has not published a tournament yet.';
    else if(r.ok){
      const o=await r.json();
      if(o&&o.v===1){
        viewMsg='Updated '+new Date(o.t||Date.now()).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})+'. This page refreshes by itself.';
        if(o.t!==S.t){S=ensureDefaults(o);renderSafe();}
      }
    }
  }catch(e){viewMsg='Could not reach the page right now. Trying again.';}
  setStatus();
}
function startGh(){
  document.body.classList.toggle('view',VIEW);
  if(VIEW){
    document.title='Game Night Gauntlet · live';
    viewPoll();setInterval(viewPoll,45000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden) viewPoll();});
  }else{
    try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
    setStatus();
  }
}
render();
initDb();
startGh();

</script>
